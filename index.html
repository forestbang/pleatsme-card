<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLEATSME 전자명함</title>
<style>
:root{--ink:#111;--sub:#6b6b6b;--line:#e6e6e6;--bg:#fff;--soft:#fafafa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f2f2f2;color:var(--ink);
 font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* 명함 */
.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.06)}
.langbar{display:flex;justify-content:flex-end;padding:14px 18px 0}
.langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langtoggle button{border:0;background:#fff;color:#9a9a9a;font-size:11px;letter-spacing:.09em;padding:7px 13px;cursor:pointer;transition:.18s}
.langtoggle button.on{background:var(--ink);color:#fff}
.logos{display:flex;flex-direction:column;align-items:center;gap:13px;padding:26px 0 30px}
.logos img{display:block;opacity:.92}
.logos .l1{height:21px}.logos .l2{height:16px}.logos .l3{height:17px}
.hr{height:1px;background:var(--line);margin:0 34px}
.idblock{padding:34px 34px 26px;text-align:center}
.nm{font-size:31px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.nm.en{font-size:25px;letter-spacing:.11em;font-weight:600}
.nmsub{margin-top:9px;font-size:12.5px;color:var(--sub);letter-spacing:.06em}
.role{margin-top:16px;font-size:13px;letter-spacing:.05em;color:#2b2b2b}
.role span{color:#c9c9c9;margin:0 8px}
.rows{padding:8px 34px 4px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #f2f2f2}
.row:last-child{border-bottom:0}
.row svg{flex:0 0 17px;width:17px;height:17px;stroke:#9b9b9b;fill:none;stroke-width:1.5}
.rt{flex:1;min-width:0}
.rlab{font-size:9.5px;color:#adadad;letter-spacing:.13em;text-transform:uppercase}
.rval{font-size:14.5px;margin-top:3px;word-break:break-all;letter-spacing:.01em}
.rval .small{font-size:12.8px;line-height:1.5;color:#3a3a3a}
.acts{padding:22px 34px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;border-radius:11px;font-size:13px;
 letter-spacing:.02em;cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink);transition:.15s}
.btn svg{flex:0 0 16px;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn span{white-space:nowrap}
.btn.solid{background:var(--ink);color:#fff}
.btn.full{grid-column:1/-1}
.btn:active{transform:scale(.985)}
.foot{padding:26px 34px 46px;text-align:center;border-top:1px solid var(--line);margin-top:24px}
.foot .co{font-size:12.5px;letter-spacing:.05em;font-weight:600}
.foot .ad{margin-top:8px;font-size:11.5px;color:var(--sub);line-height:1.65}
.foot .wb{margin-top:11px;font-size:11.5px;color:#8a8a8a;letter-spacing:.04em;border-bottom:1px solid #ddd;display:inline-block;padding-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:24px;overflow:auto}
.modal.on{display:flex}
.mcard{background:#fff;border-radius:18px;padding:26px;text-align:center;max-width:340px;width:100%;margin:auto}
.mcard h4{margin:0 0 4px;font-size:14px;letter-spacing:.05em}
.mcard p{margin:0 0 16px;font-size:11.5px;color:var(--sub);line-height:1.65}
.qrbox{display:flex;justify-content:center}
.qrbox canvas{width:212px!important;height:212px!important;max-width:100%}
.mclose{margin-top:9px;width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer}
.state{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;display:flex;align-items:center;justify-content:center;
 text-align:center;padding:40px 34px;color:var(--sub);font-size:13.5px;line-height:1.8}

/* 관리 */
.adm{max-width:1120px;margin:0 auto;padding:30px 18px 90px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:19px;letter-spacing:.03em;margin:0}
.top .tag{font-size:11px;color:#fff;background:#111;border-radius:999px;padding:4px 10px;letter-spacing:.04em}
.desc{font-size:12.5px;color:var(--sub);margin:0 0 20px;line-height:1.65}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{border:0;background:none;padding:11px 16px;font-size:13px;color:#999;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 430px;gap:24px;align-items:start}
@media(max-width:920px){.grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h3{margin:0 0 16px;font-size:12px;letter-spacing:.09em;color:#555;text-transform:uppercase}
.f{margin-bottom:13px}
.f label{display:block;font-size:11px;color:#777;margin-bottom:5px;letter-spacing:.04em}
.f input,.f select{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:9px;font-size:13.5px;background:#fff}
.f input:focus,.f select:focus{outline:0;border-color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:10.5px;color:#aaa;margin-top:4px;line-height:1.5}
.abtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.abtn{padding:11px 16px;border-radius:9px;border:1px solid var(--ink);background:#fff;font-size:12.5px;cursor:pointer}
.abtn.solid{background:var(--ink);color:#fff}
.abtn.ghost{border-color:#ddd;color:#888}
.abtn:disabled{opacity:.45;cursor:default}
.li{display:flex;align-items:center;gap:10px;padding:13px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff;flex-wrap:wrap}
.li.off{background:#fafafa;opacity:.62}
.li .who{flex:1;min-width:150px}
.li .who b{font-size:13.5px}
.li .who small{display:block;color:#999;font-size:11px;margin-top:2px}
.mini{padding:7px 10px;font-size:11px;border-radius:7px;border:1px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap}
.mini.danger{color:#b23b3b;border-color:#e8cccc}
.mini.on{background:#111;color:#fff;border-color:#111}
.phone{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.phone .wrap{box-shadow:none;min-height:auto;max-width:none}
.note{background:#fbfbf8;border:1px solid #eee;border-radius:11px;padding:15px 16px;font-size:11.5px;color:#666;line-height:1.75;margin-top:16px}
.note b{color:#333}
.urlbox{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:11.5px;color:#555;word-break:break-all;margin-top:10px}
.gate{max-width:400px;margin:16vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px}
.gate h2{margin:0 0 6px;font-size:17px;letter-spacing:.03em}
.gate p{margin:0 0 22px;font-size:12px;color:var(--sub);line-height:1.65}
.gate input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;font-size:14px;margin-bottom:10px}
.gate button{width:100%;padding:13px;border-radius:10px;border:1px solid #111;background:#111;color:#fff;font-size:13.5px;cursor:pointer}
.gate .err{color:#b23b3b;font-size:12px;margin-top:10px;min-height:16px}
.searchbar{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:9px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;
 border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.on{opacity:1}
pre.plain{background:#fafafa;border:1px solid #eee;border-radius:9px;padding:12px;font-size:11.5px;line-height:1.65;
 white-space:pre-wrap;word-break:break-all;margin:0 0 12px;font-family:inherit;color:#444;text-align:left}
</style>
</head>
<body>
<div id="app"><div class="state">불러오는 중…</div></div>
<div class="toast" id="toast"></div>

/* ---------- 공통 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function intl(t){if(!t)return"";t=String(t).replace(/[^0-9]/g,"");
 if(t.indexOf("0")===0)return"+82-"+t.slice(1,3)+"-"+t.slice(3,7)+"-"+t.slice(7);return t;}
function baseUrl(){return location.origin+location.pathname;}
function cardUrl(id){return baseUrl()+"?id="+encodeURIComponent(id);}
function autoLang(){return (navigator.language||"en").toLowerCase().indexOf("ko")===0?"ko":"en";}
function platform(){var u=navigator.userAgent||"";
 if(/iPad|iPhone|iPod/.test(u)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))return"ios";
 if(/Android/i.test(u))return"android";return"pc";}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");
 clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("on")},1900);}

/* ---------- Firebase ---------- */
function fbGet(path){
  return fetch(FB+path+".json?_="+(performance.now()|0),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
function fbPut(path,data){
  return fetch(FB+path+".json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
function fbDel(path){
  return fetch(FB+path+".json",{method:"DELETE"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return true; });
}
function loadCompany(){
  return fbGet(P_CFG+"/company").then(function(c){
    if(c){ for(var k in DEFAULT_COMPANY){ if(c[k]!=null && c[k]!=="") COMPANY[k]=c[k]; } }
    return COMPANY;
  }).catch(function(){ return COMPANY; });
}
function sha256(txt){
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf),function(b){return ("0"+b.toString(16)).slice(-2)}).join("");
    });
  }
  var h=5381; for(var i=0;i<txt.length;i++){ h=((h<<5)+h+txt.charCodeAt(i))|0; }
  return Promise.resolve("fallback"+(h>>>0).toString(16));
}

/* ---------- vCard ---------- */
function vcard(p,lang){
  var isEn=lang==="en";
  var name=isEn?(p.nameEn||p.nameKo):(p.nameKo||p.nameEn);
  var org=isEn?COMPANY.nameEn:COMPANY.nameKo;
  var dept=isEn?(p.deptEn||p.deptKo):(p.deptKo||p.deptEn);
  var title=isEn?(p.titleEn||p.titleKo):(p.titleKo||p.titleEn);
  var addr=isEn?COMPANY.addrEn:COMPANY.addrKo;
  var mob=isEn?intl(p.mobile):p.mobile;
  var off=isEn?(COMPANY.officeIntl||COMPANY.office):COMPANY.office;
  var L=["BEGIN:VCARD","VERSION:3.0"];
  L.push("N:"+name+";;;;"); L.push("FN:"+name);
  if(isEn && p.nameKo && p.nameEn) L.push("NICKNAME:"+p.nameKo);
  if(!isEn && p.nameEn) L.push("NICKNAME:"+p.nameEn);
  L.push("ORG:"+org+";"+(dept||""));
  if(title) L.push("TITLE:"+title);
  if(p.mobile) L.push("TEL;TYPE=CELL,VOICE:"+mob);
  if(COMPANY.office) L.push("TEL;TYPE=WORK,VOICE:"+off);
  if(p.email) L.push("EMAIL;TYPE=WORK,INTERNET:"+p.email);
  L.push("ADR;TYPE=WORK:;;"+addr+";;;;");
  if(COMPANY.web) L.push("URL:"+COMPANY.web);
  L.push("NOTE:PLEATSME / LAPLI");
  L.push("END:VCARD");
  return L.join("\r\n");
}
function downloadVcf(p,lang){
  var blob=new Blob([vcard(p,lang)],{type:"text/vcard;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=(p.nameEn||p.nameKo||p.id).replace(/\s+/g,"_")+".vcf"; a.rel="noopener";
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url)},4000);
}
function plainText(p,lang){
  var isEn=lang==="en", L=[];
  L.push(isEn?(p.nameEn||p.nameKo):(p.nameKo||p.nameEn));
  var d=isEn?(p.deptEn||p.deptKo):(p.deptKo||p.deptEn);
  var t=isEn?(p.titleEn||p.titleKo):(p.titleKo||p.titleEn);
  L.push([isEn?COMPANY.nameEn:COMPANY.nameKo,d,t].filter(Boolean).join(" / "));
  if(p.mobile) L.push("M. "+(isEn?intl(p.mobile):p.mobile));
  if(COMPANY.office) L.push("T. "+(isEn?(COMPANY.officeIntl||COMPANY.office):COMPANY.office));
  if(p.email) L.push("E. "+p.email);
  L.push(isEn?COMPANY.addrEn:COMPANY.addrKo);
  L.push(COMPANY.web);
  return L.join("\n");
}
function copyText(txt,btn,doneLabel){
  function flash(){ if(!btn)return toast(doneLabel); var o=btn.textContent; btn.textContent=doneLabel;
    setTimeout(function(){btn.textContent=o},1600); }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(flash,legacy);
  } else legacy();
  function legacy(){
    var ta=document.createElement("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");flash()}catch(e){alert(txt)}
    document.body.removeChild(ta);
  }
}

/* ---------- QR ---------- */
function qrCanvas(text,size,quiet){
  quiet=(quiet==null)?4:quiet;
  var q=qrcode(0,"M"); q.addData(text); q.make();
  var n=q.getModuleCount();
  var cell=Math.max(1,Math.floor(size/(n+quiet*2)));
  var dim=cell*(n+quiet*2);
  var cv=document.createElement("canvas"); cv.width=dim; cv.height=dim;
  var g=cv.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,dim,dim); g.fillStyle="#111";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell);
  return cv;
}
function makeQr(el,text,size){
  el.innerHTML="";
  try{ var cv=qrCanvas(text,size); cv.style.imageRendering="pixelated"; el.appendChild(cv); }
  catch(e){ el.innerHTML='<div style="font-size:12px;color:#999;padding:30px">QR을 만들지 못했습니다</div>'; }
}
function downloadQr(p){
  try{
    var cv=qrCanvas(cardUrl(p.id),1200);
    var a=document.createElement("a"); a.href=cv.toDataURL("image/png");
    a.download="QR_"+(p.nameEn||p.nameKo||p.id).replace(/\s+/g,"_")+".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("QR 이미지를 저장했습니다");
  }catch(e){ alert("QR을 만들지 못했습니다."); }
}

/* ---------- 명함 그리기 ---------- */
function renderCard(p,lang,opt){
  opt=opt||{};
  var t=T[lang], isEn=lang==="en";
  var showToggle=(p.display==="auto"||!p.display);
  var name=isEn?(p.nameEn||p.nameKo):(p.nameKo||p.nameEn);
  var other=isEn?(p.nameKo||""):(p.nameEn||"");
  var dept=isEn?(p.deptEn||p.deptKo):(p.deptKo||p.deptEn);
  var title=isEn?(p.titleEn||p.titleKo):(p.titleKo||p.titleEn);
  var addr=isEn?COMPANY.addrEn:COMPANY.addrKo;
  var co=isEn?COMPANY.nameEn:COMPANY.nameKo;
  var mob=isEn?intl(p.mobile):p.mobile;
  var offShow=isEn?(COMPANY.officeIntl||COMPANY.office):COMPANY.office;

  var h='<div class="wrap">';
  h += showToggle
    ? '<div class="langbar"><div class="langtoggle">'
      +'<button data-lang="ko" class="'+(lang==="ko"?"on":"")+'">한국어</button>'
      +'<button data-lang="en" class="'+(lang==="en"?"on":"")+'">ENGLISH</button></div></div>'
    : '<div style="height:14px"></div>';
  h += '<div class="logos"><img class="l1" src="'+LOGO.pleatsme+'" alt="Pleatsme">'
     + '<img class="l2" src="'+LOGO.lapli+'" alt="LAPLI">'
     + '<img class="l3" src="'+LOGO.pleats+'" alt="Pleats"></div><div class="hr"></div>';
  h += '<div class="idblock"><div class="nm'+(isEn?" en":"")+'">'+esc(name)+'</div>'
     + (other?'<div class="nmsub">'+esc(other)+'</div>':'')
     + '<div class="role">'+esc(dept||"")+(dept&&title?'<span>|</span>':'')+esc(title||"")+'</div></div>';
  h += '<div class="rows">';
  if(p.mobile) h+=row(ICON.mobile,t.mobile,esc(mob),"tel:"+intl(p.mobile));
  if(COMPANY.office) h+=row(ICON.phone,t.office,esc(offShow),"tel:"+String(offShow).replace(/[^0-9+]/g,""));
  if(p.email) h+=row(ICON.mail,t.email,esc(p.email),"mailto:"+p.email);
  h += row(ICON.pin,t.addr,'<span class="small">'+esc(addr)+'</span>',
        "https://maps.google.com/?q="+encodeURIComponent(COMPANY.addrEn));
  h += row(ICON.globe,t.web,esc(COMPANY.web.replace(/^https?:\/\//,"")),COMPANY.web);
  h += '</div>';
  h += '<div class="acts"><button class="btn solid full" id="btnSave">'+ICON.down+'<span>'+t.save+'</span></button>'
     + '<a class="btn" href="tel:'+intl(p.mobile)+'"><span>'+t.call+'</span></a>'
     + '<a class="btn" href="mailto:'+esc(p.email)+'"><span>'+t.mail+'</span></a>'
     + (opt.noQr?'':'<button class="btn full" id="btnQr">'+ICON.qr+'<span>'+t.qr+'</span></button>')+'</div>';
  h += '<div class="foot"><div class="co">'+esc(co)+'</div><div class="ad">'+esc(addr)+'</div>'
     + '<a class="wb" href="'+COMPANY.web+'" target="_blank">'+COMPANY.web.replace(/^https?:\/\//,"")+'</a></div>';
  return h+'</div>';
}
function row(icon,lab,val,href){
  return '<a class="row" href="'+href+'" target="_blank">'+icon
    +'<div class="rt"><div class="rlab">'+lab+'</div><div class="rval">'+val+'</div></div></a>';
}

function viewMode(id){

  Promise.all([loadCompany(), fbGet(P_CARDS+"/"+id)]).then(function(r){

    if(p.active===false) return app.innerHTML='<div class="state">현재 사용하지 않는 명함입니다.<br><br>'
      +esc(COMPANY.nameKo)+'<br>'+esc(COMPANY.office)+'</div>';
    p.id=id; show(p);
  }).catch(function(){
    app.innerHTML='<div class="state">명함을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>';
  });

  function show(p){
    var q=new URLSearchParams(location.search);
    var lang=q.get("lang");
    if(p.display==="ko") lang="ko"; else if(p.display==="en") lang="en";
    else if(lang!=="ko"&&lang!=="en") lang=autoLang();
    paint();
    function paint(){
      var t=T[lang], pf=platform();
      var howto = pf==="ios"?t.saveIos : pf==="android"?t.saveAnd : t.savePc;
      document.documentElement.lang=lang;
      app.innerHTML = renderCard(p,lang)
        + '<div class="modal" id="qrModal"><div class="mcard"><h4>'+t.qrTitle+'</h4><p>'+t.qrSub+'</p>'
        + '<div class="qrbox" id="qrbox"></div><button class="mclose" id="mclose">'+t.close+'</button></div></div>'
        + '<div class="modal" id="saveModal"><div class="mcard" style="text-align:left">'
        + '<h4 style="text-align:center;margin-bottom:12px">'+t.saveTitle+'</h4>'
        + '<p style="text-align:left">'+howto+'</p><p style="text-align:left;color:#999">'+t.saveAlt+'</p>'
        + '<pre class="plain">'+esc(plainText(p,lang))+'</pre>'
        + '<button class="mclose" id="btnCopy" style="margin-top:0;background:#111;color:#fff;border-color:#111">'+t.copyBtn+'</button>'
        + '<button class="mclose" id="sclose">'+t.close+'</button></div></div>';
      var tg=app.querySelectorAll(".langtoggle button");
      for(var i=0;i<tg.length;i++) tg[i].onclick=function(){lang=this.getAttribute("data-lang");paint()};
      document.getElementById("btnSave").onclick=function(){
        downloadVcf(p,lang);
        setTimeout(function(){document.getElementById("saveModal").classList.add("on")},700);
      };
      document.getElementById("btnCopy").onclick=function(){copyText(plainText(p,lang),this,T[lang].copied)};
      document.getElementById("sclose").onclick=function(){document.getElementById("saveModal").classList.remove("on")};
      document.getElementById("saveModal").onclick=function(e){if(e.target===this)this.classList.remove("on")};
      var bq=document.getElementById("btnQr");
      if(bq) bq.onclick=function(){
        document.getElementById("qrModal").classList.add("on");
        makeQr(document.getElementById("qrbox"),cardUrl(p.id),424);
      };
      document.getElementById("mclose").onclick=function(){document.getElementById("qrModal").classList.remove("on")};
      document.getElementById("qrModal").onclick=function(e){if(e.target===this)this.classList.remove("on")};
    }
  }
}

function tabIssue(){
  document.getElementById("tabbody").innerHTML=
   '<div class="grid"><div><div class="panel"><h3>'+(editing?"직원 정보 수정":"새 직원 명함")+'</h3><div id="form"></div>'
   +'<div class="abtns"><button class="abtn solid" id="bIssue">'+(editing?"수정 내용 저장":"명함 발급")+'</button>'
   +'<button class="abtn" id="bNew">새로 입력</button></div>'
   +'<div class="urlbox" id="urlbox"></div>'
   +'<div class="note"><b>[명함 주소]</b>는 한 번 정하면 바꾸지 마세요. 이 값이 QR에 들어갑니다.<br>'
   +'이름·직급·번호는 나중에 고쳐도 <b>이미 나눠 준 QR을 그대로 쓸 수 있습니다.</b></div></div></div>'
   +'<div><div class="panel"><h3>미리보기</h3>'
   +'<div style="display:flex;gap:8px;margin-bottom:12px">'
   +'<button class="abtn" id="pKo" style="flex:1">한국어</button>'
   +'<button class="abtn" id="pEn" style="flex:1">ENGLISH</button></div>'
   +'<div class="phone" id="preview"></div></div></div></div>';
  document.getElementById("bIssue").onclick=issueCard;
  document.getElementById("bNew").onclick=function(){editing=null;drawAdmin()};
  document.getElementById("pKo").onclick=function(){previewLang="ko";drawPreview()};
  document.getElementById("pEn").onclick=function(){previewLang="en";drawPreview()};
  drawForm();

function drawForm(){
  var p=editing||{display:"auto"};
  document.getElementById("form").innerHTML=
    '<div class="f"><label>명함 주소 (영문 소문자)</label>'
    +'<input id="f_id" value="'+esc(p.id||"")+'" placeholder="kjh"'+(editing?' disabled style="background:#f5f5f5;color:#888"':'')+'>'
    +'<div class="hint">'+(editing?'발급 후에는 바꿀 수 없습니다.':'이 사람 명함의 인터넷 주소가 됩니다. 예: kjh')+'</div></div>'
   +'<div class="f2">'+fld("nameKo","이름 (한글)",p.nameKo,"김지환")+fld("nameEn","이름 (영문)",p.nameEn,"KIM JI HWAN")+'</div>'
   +'<div class="f2">'+fld("deptKo","부서 (한글)",p.deptKo,"영업BU")+fld("deptEn","부서 (영문)",p.deptEn,"Sales BU")+'</div>'
   +'<div class="f2">'+fld("titleKo","직급 (한글)",p.titleKo,"이사")+fld("titleEn","직급 (영문)",p.titleEn,"Director")+'</div>'
   +fld("mobile","휴대전화",p.mobile,"010-0000-0000","영문 명함에서는 자동으로 +82-10-… 으로 바뀝니다")
   +fld("email","이메일",p.email,"name@pleatsme.com")
   +'<div class="f"><label>언어 표기</label><select id="f_display">'
   +'<option value="auto"'+(p.display==="auto"?" selected":"")+'>한글+영문 (전환 버튼 표시 · 추천)</option>'
   +'<option value="ko"'+(p.display==="ko"?" selected":"")+'>한글만</option>'
   +'<option value="en"'+(p.display==="en"?" selected":"")+'>영문만</option></select>'
   +'<div class="hint">추천 설정은 상대방 휴대폰 언어에 맞춰 자동으로 열립니다.</div></div>';
  ["id","nameKo","nameEn","deptKo","deptEn","titleKo","titleEn","mobile","email"].forEach(function(k){
    var e=document.getElementById("f_"+k); if(e) e.oninput=drawPreview;
  });
  document.getElementById("f_display").onchange=drawPreview;
  drawPreview();
}
function readForm(){
  function v(k){var e=document.getElementById("f_"+k);return e?e.value.trim():""}
  return {id:(editing?editing.id:v("id").toLowerCase().replace(/[^a-z0-9_-]/g,"")),
    nameKo:v("nameKo"),nameEn:v("nameEn"),deptKo:v("deptKo"),deptEn:v("deptEn"),
    titleKo:v("titleKo"),titleEn:v("titleEn"),mobile:v("mobile"),email:v("email"),
    display:document.getElementById("f_display").value};
}
function drawPreview(){
  var p=readForm();
  if(!p.nameKo&&!p.nameEn) p.nameKo="이름을 입력하세요";
  var lang=p.display==="ko"?"ko":p.display==="en"?"en":previewLang;
  document.getElementById("preview").innerHTML=renderCard(p,lang,{noQr:true});
  var tg=document.querySelectorAll("#preview .langtoggle button");
  for(var i=0;i<tg.length;i++) tg[i].onclick=function(){previewLang=this.getAttribute("data-lang");drawPreview()};
  var bs=document.querySelector("#preview #btnSave"); if(bs) bs.onclick=function(){downloadVcf(p,lang)};
  document.getElementById("urlbox").innerHTML=p.id
    ?'명함 주소 : <b>'+esc(cardUrl(p.id))+'</b>':'명함 주소(영문 소문자)를 입력하면 주소가 표시됩니다.';
}
function issueCard(){
  var p=readForm();
  if(!p.id) return alert("명함 주소(영문 소문자)를 입력해 주세요.");
  if(!p.nameKo&&!p.nameEn) return alert("이름을 입력해 주세요.");
  var isNew=!editing;
  if(isNew && STAFF.some(function(s){return s.id===p.id}))
    return alert("이미 쓰고 있는 명함 주소입니다. 다른 주소를 정해 주세요.");
  var data={nameKo:p.nameKo,nameEn:p.nameEn,deptKo:p.deptKo,deptEn:p.deptEn,
    titleKo:p.titleKo,titleEn:p.titleEn,mobile:p.mobile,email:p.email,
    display:p.display,active:editing?(editing.active!==false):true};
  var btn=document.getElementById("bIssue"); btn.disabled=true; btn.textContent="저장 중…";
  fbPut(P_CARDS+"/"+p.id,data).then(function(){
    data.id=p.id;
    var i=STAFF.findIndex(function(s){return s.id===p.id});
    if(i>=0) STAFF[i]=data; else STAFF.push(data);
    editing=null; drawAdmin(); showResult(data, isNew);
  }).catch(function(){
    btn.disabled=false; btn.textContent=isNew?"명함 발급":"수정 내용 저장";
    alert("저장하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 눌러 주세요.");
  });
}
function showResult(p,isNew){
  var m=document.getElementById("resModal");
  document.getElementById("resName").textContent=(p.nameKo||p.nameEn)+" 님";
  document.getElementById("resSub").textContent=isNew?"명함이 발급되었습니다":"수정 내용이 반영되었습니다";
  document.getElementById("resUrl").innerHTML=esc(cardUrl(p.id));
  makeQr(document.getElementById("resQr"),cardUrl(p.id),424);
  document.getElementById("resDl").onclick=function(){downloadQr(p)};
  document.getElementById("resCopy").onclick=function(){
    var msg=(p.nameKo||p.nameEn)+" 님 전자명함입니다.\n"+cardUrl(p.id)
      +"\n\n· 휴대폰에서 링크를 열면 명함이 뜹니다.\n· [연락처 저장]을 누르면 상대방 주소록에 바로 들어갑니다.\n"
      +"· 종이명함에 넣을 QR 이미지는 경영지원BU에 요청하세요.";
    copyText(msg,this,"복사했습니다");
  };
  m.classList.add("on");
}

/* --- 목록 탭 --- */
function tabList(){
  document.getElementById("tabbody").innerHTML=
    '<div class="panel"><h3>등록된 직원</h3>'
    +'<input class="searchbar" id="q" placeholder="이름·부서로 찾기" value="'+esc(filter)+'">'
    +'<div id="list"></div>'
    +'<div class="note"><b>사용중지</b>를 누르면 그 사람 명함 주소가 즉시 막힙니다. 퇴사자가 생기면 여기서 끄시면 됩니다.<br>'
    +'다시 [사용]으로 돌리면 예전 QR이 그대로 살아납니다.</div></div>';
  document.getElementById("q").oninput=function(){filter=this.value;renderList()};
  renderList();
}
function renderList(){
  var el=document.getElementById("list");
  var f=filter.trim().toLowerCase();
  var arr=STAFF.filter(function(s){
    if(!f) return true;
    return ((s.nameKo||"")+(s.nameEn||"")+(s.deptKo||"")+(s.titleKo||"")+s.id).toLowerCase().indexOf(f)>=0;
  });
  if(!arr.length) return el.innerHTML='<div style="font-size:12.5px;color:#aaa;padding:14px 0">'
    +(STAFF.length?"찾는 직원이 없습니다.":"아직 발급된 명함이 없습니다. [명함 발급] 탭에서 시작하세요.")+'</div>';
  el.innerHTML=arr.map(function(s){
    var off=s.active===false;
    return '<div class="li'+(off?" off":"")+'"><div class="who"><b>'+esc(s.nameKo||s.nameEn)+'</b>'
      +'<small>'+esc(s.deptKo||"")+' · '+esc(s.titleKo||"")+' · '+esc(s.id)+(off?' · 사용중지':'')+'</small></div>'
      +'<button class="mini" data-a="edit" data-id="'+esc(s.id)+'">수정</button>'
      +'<button class="mini" data-a="open" data-id="'+esc(s.id)+'">열어보기</button>'
      +'<button class="mini" data-a="qr" data-id="'+esc(s.id)+'">QR</button>'
      +'<button class="mini'+(off?"":" on")+'" data-a="tog" data-id="'+esc(s.id)+'">'+(off?"사용":"사용중지")+'</button>'
      +'<button class="mini danger" data-a="del" data-id="'+esc(s.id)+'">삭제</button></div>';
  }).join("");
  var bs=el.querySelectorAll("button");
  for(var i=0;i<bs.length;i++) bs[i].onclick=function(){
    var id=this.getAttribute("data-id"), a=this.getAttribute("data-a");
    var p=STAFF.find(function(s){return s.id===id}); if(!p) return;
    if(a==="edit"){ editing=p; curTab="issue"; drawAdmin(); }
    if(a==="open"){ window.open(cardUrl(id),"_blank"); }
    if(a==="qr"){ downloadQr(p); }
    if(a==="tog"){
      var next=(p.active===false);
      fbPut(P_CARDS+"/"+id+"/active",next).then(function(){
        p.active=next; renderList(); toast(next?"다시 사용합니다":"사용을 중지했습니다");
      }).catch(function(){alert("바꾸지 못했습니다. 다시 시도해 주세요.")});
    }
    if(a==="del"){
      if(!confirm((p.nameKo||p.nameEn)+" 님 명함을 완전히 지울까요?\n\n지우면 되돌릴 수 없습니다.\n잠시 막아두려면 [사용중지]를 쓰세요.")) return;
      fbDel(P_CARDS+"/"+id).then(function(){
        STAFF=STAFF.filter(function(s){return s.id!==id}); drawAdmin(); toast("삭제했습니다");
      }).catch(function(){alert("지우지 못했습니다. 다시 시도해 주세요.")});
    }
  };
}

   +'· 옆에 작게 "명함 저장 / Save Contact" 표기<br>· 대량 인쇄 전 실물 스캔 테스트 필수</div></div></div></div>';

    function v(k){return document.getElementById("f_"+k).value.trim()}
    var co={nameKo:v("cnameKo"),nameEn:v("cnameEn"),addrKo:v("caddrKo"),addrEn:v("caddrEn"),
      office:v("coffice"),officeIntl:v("cofficeIntl"),web:v("cweb")};
    var b=this; b.disabled=true; b.textContent="저장 중…";
    fbPut(P_CFG+"/company",co).then(function(){
      COMPANY=co; b.disabled=false; b.textContent="회사 정보 저장"; toast("회사 정보를 저장했습니다");
    }).catch(function(){ b.disabled=false; b.textContent="회사 정보 저장"; alert("저장하지 못했습니다."); });

  document.getElementById("bPw").onclick=function(){
    var a=document.getElementById("np1").value,b2=document.getElementById("np2").value;

    if(a!==b2) return alert("두 번 입력한 암호가 다릅니다.");
    sha256(a).then(function(h){return fbPut(P_CFG+"/pwhash",h)})
      .then(function(){ document.getElementById("np1").value="";document.getElementById("np2").value="";
        toast("암호를 바꿨습니다"); })
      .catch(function(){alert("바꾸지 못했습니다.")});
  };
}
