<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLEATSME 전자명함</title>
<style>
:root{
  --ink:#111; --sub:#6b6b6b; --line:#e6e6e6; --bg:#fff; --soft:#fafafa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#f2f2f2;color:var(--ink);
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ---------- 명함 화면 ---------- */
.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  box-shadow:0 0 60px rgba(0,0,0,.06);position:relative}
.langbar{display:flex;justify-content:flex-end;padding:14px 18px 0}
.langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langtoggle button{border:0;background:#fff;color:#9a9a9a;font-size:11px;letter-spacing:.09em;
  padding:7px 13px;cursor:pointer;transition:.18s}
.langtoggle button.on{background:var(--ink);color:#fff}
.logos{display:flex;flex-direction:column;align-items:center;gap:13px;padding:26px 0 30px}
.logos img{display:block;opacity:.92}
.logos .l1{height:21px}.logos .l2{height:16px}.logos .l3{height:17px}
.hr{height:1px;background:var(--line);margin:0 34px}
.idblock{padding:34px 34px 26px;text-align:center}
.nm{font-size:31px;font-weight:700;letter-spacing:.02em;line-height:1.15}
.nm.en{font-size:25px;letter-spacing:.11em;font-weight:600}
.nmsub{margin-top:9px;font-size:12.5px;color:var(--sub);letter-spacing:.06em}
.role{margin-top:16px;font-size:13px;letter-spacing:.05em;color:#2b2b2b}
.role span{color:#c9c9c9;margin:0 8px}
.rows{padding:8px 34px 4px}
.row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #f2f2f2}
.row:last-child{border-bottom:0}
.row svg{flex:0 0 17px;width:17px;height:17px;stroke:#9b9b9b;fill:none;stroke-width:1.5}
.rt{flex:1;min-width:0}
.rlab{font-size:9.5px;color:#adadad;letter-spacing:.13em;text-transform:uppercase}
.rval{font-size:14.5px;margin-top:3px;word-break:break-all;letter-spacing:.01em}
.rval.small{font-size:12.8px;line-height:1.5;color:#3a3a3a}
.acts{padding:22px 34px 10px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:14px 8px;border-radius:11px;
  font-size:13px;letter-spacing:.02em;cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink);transition:.15s}
.btn svg{flex:0 0 16px;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.btn span{white-space:nowrap}
.btn.solid{background:var(--ink);color:#fff}
.btn.full{grid-column:1/-1}
.btn:active{transform:scale(.985)}
.foot{padding:26px 34px 46px;text-align:center;border-top:1px solid var(--line);margin-top:24px}
.foot .co{font-size:12.5px;letter-spacing:.05em;font-weight:600}
.foot .ad{margin-top:8px;font-size:11.5px;color:var(--sub);line-height:1.65}
.foot .wb{margin-top:11px;font-size:11.5px;color:#8a8a8a;letter-spacing:.04em;border-bottom:1px solid #ddd;display:inline-block;padding-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal.on{display:flex}
.mcard{background:#fff;border-radius:18px;padding:28px;text-align:center;max-width:320px;width:100%}
.mcard h4{margin:0 0 4px;font-size:14px;letter-spacing:.05em}
.mcard p{margin:0 0 18px;font-size:11.5px;color:var(--sub)}
.mcard .qrbox{display:flex;justify-content:center}
.mcard .qrbox img,.mcard .qrbox canvas{width:212px!important;height:212px!important;max-width:100%}
.mclose{margin-top:20px;width:100%;padding:12px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:13px;cursor:pointer}
.err{padding:80px 30px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}

/* ---------- 관리자 화면 ---------- */
.adm{max-width:1080px;margin:0 auto;padding:34px 20px 80px}
.adm h1{font-size:19px;letter-spacing:.03em;margin:0 0 4px}
.adm .desc{font-size:12.5px;color:var(--sub);margin:0 0 26px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 430px;gap:26px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.panel h3{margin:0 0 16px;font-size:13px;letter-spacing:.08em;color:#444;text-transform:uppercase}
.f{margin-bottom:13px}
.f label{display:block;font-size:11px;color:#777;margin-bottom:5px;letter-spacing:.04em}
.f input,.f select{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:9px;font-size:13.5px;background:#fff}
.f input:focus,.f select:focus{outline:0;border-color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.hint{font-size:10.5px;color:#aaa;margin-top:4px;line-height:1.5}
.abtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.abtn{padding:11px 16px;border-radius:9px;border:1px solid var(--ink);background:#fff;font-size:12.5px;cursor:pointer}
.abtn.solid{background:var(--ink);color:#fff}
.abtn.ghost{border-color:#ddd;color:#888}
.list{margin-top:8px}
.li{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff}
.li:hover{border-color:#bbb}
.li .who{flex:1;min-width:0}
.li .who b{font-size:13.5px}
.li .who small{display:block;color:#999;font-size:11px;margin-top:2px}
.li .mini{padding:7px 10px;font-size:11px;border-radius:7px;border:1px solid #ddd;background:#fff;cursor:pointer;white-space:nowrap}
.phone{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#fff}
.phone .wrap{box-shadow:none;min-height:auto;max-width:none}
.note{background:#fbfbf8;border:1px solid #eee;border-radius:11px;padding:15px 16px;font-size:11.5px;color:#666;line-height:1.75;margin-top:16px}
.note b{color:#333}
.urlbox{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:11.5px;color:#555;word-break:break-all;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>

/* ---------- 도우미 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function intl(t){ if(!t) return ""; t=String(t).replace(/[^0-9]/g,"");
  if(t.indexOf("0")===0) return "+82-"+t.slice(1,3)+"-"+t.slice(3,7)+"-"+t.slice(7);
  return t; }
function findStaff(id){ for(var i=0;i<STAFF.length;i++){ if(STAFF[i].id===id) return STAFF[i]; } return null; }
function baseUrl(){ return location.origin + location.pathname; }
function cardUrl(id){ return baseUrl() + "?id=" + encodeURIComponent(id); }
function autoLang(){ return (navigator.language||"en").toLowerCase().indexOf("ko")===0 ? "ko" : "en"; }

/* ---------- vCard ---------- */
function vcard(p, lang){
  var isEn = lang==="en";
  var name = isEn ? (p.nameEn||p.nameKo) : (p.nameKo||p.nameEn);
  var org  = isEn ? COMPANY.nameEn : COMPANY.nameKo;
  var dept = isEn ? (p.deptEn||p.deptKo) : (p.deptKo||p.deptEn);
  var title= isEn ? (p.titleEn||p.titleKo) : (p.titleKo||p.titleEn);
  var addr = isEn ? COMPANY.addrEn : COMPANY.addrKo;
  var mob  = isEn ? intl(p.mobile) : p.mobile;
  var off  = isEn ? (COMPANY.officeIntl || COMPANY.office) : COMPANY.office;
  var L = ["BEGIN:VCARD","VERSION:3.0"];
  L.push("N:"+name+";;;;");
  L.push("FN:"+name);
  if(isEn && p.nameKo && p.nameEn) L.push("NICKNAME:"+p.nameKo);
  if(!isEn && p.nameEn) L.push("NICKNAME:"+p.nameEn);
  L.push("ORG:"+org+";"+(dept||""));
  if(title) L.push("TITLE:"+title);
  if(p.mobile) L.push("TEL;TYPE=CELL,VOICE:"+mob);
  if(COMPANY.office) L.push("TEL;TYPE=WORK,VOICE:"+off);
  if(p.email) L.push("EMAIL;TYPE=WORK,INTERNET:"+p.email);
  L.push("ADR;TYPE=WORK:;;"+addr+";;;;");
  if(COMPANY.web) L.push("URL:"+COMPANY.web);
  L.push("NOTE:PLEATSME / LAPLI");
  L.push("END:VCARD");
  return L.join("\r\n");
}
function downloadVcf(p, lang){
  var txt = vcard(p, lang);
  var blob = new Blob(["﻿"+txt], {type:"text/vcard;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = (p.nameEn||p.id).replace(/\s+/g,"_")+".vcf";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 800);
}

/* ---------- 명함 그리기 ---------- */
function renderCard(p, lang, opt){
  opt = opt || {};
  var t = T[lang], isEn = lang==="en";
  var showToggle = (p.display==="auto" || !p.display);
  var name  = isEn ? (p.nameEn||p.nameKo) : (p.nameKo||p.nameEn);
  var other = isEn ? (p.nameKo||"") : (p.nameEn||"");
  var dept  = isEn ? (p.deptEn||p.deptKo) : (p.deptKo||p.deptEn);
  var title = isEn ? (p.titleEn||p.titleKo) : (p.titleKo||p.titleEn);
  var addr  = isEn ? COMPANY.addrEn : COMPANY.addrKo;
  var co    = isEn ? COMPANY.nameEn : COMPANY.nameKo;
  var mob   = isEn ? intl(p.mobile) : p.mobile;

  var h = '<div class="wrap">';
  if(showToggle){
    h += '<div class="langbar"><div class="langtoggle">'
       + '<button data-lang="ko" class="'+(lang==="ko"?"on":"")+'">한국어</button>'
       + '<button data-lang="en" class="'+(lang==="en"?"on":"")+'">ENGLISH</button>'
       + '</div></div>';
  } else { h += '<div style="height:14px"></div>'; }

  h += '<div class="logos">'
     + '<img class="l1" src="'+LOGO.pleatsme+'" alt="Pleatsme">'
     + '<img class="l2" src="'+LOGO.lapli+'" alt="LAPLI">'
     + '<img class="l3" src="'+LOGO.pleats+'" alt="Pleats">'
     + '</div><div class="hr"></div>';

  h += '<div class="idblock">'
     + '<div class="nm'+(isEn?" en":"")+'">'+esc(name)+'</div>'
     + (other ? '<div class="nmsub">'+esc(other)+'</div>' : '')
     + '<div class="role">'+esc(dept||"")+(dept&&title?'<span>|</span>':'')+esc(title||"")+'</div>'
     + '</div>';

  h += '<div class="rows">';
  if(p.mobile) h += row(ICON.mobile, t.mobile, esc(mob), "tel:"+intl(p.mobile));
  var offShow = isEn ? (COMPANY.officeIntl || COMPANY.office) : COMPANY.office;
  if(COMPANY.office) h += row(ICON.phone, t.office, esc(offShow),
      "tel:"+String(offShow).replace(/[^0-9+]/g,""));
  if(p.email) h += row(ICON.mail, t.email, esc(p.email), "mailto:"+p.email);
  h += row(ICON.pin, t.addr, '<span class="small">'+esc(addr)+'</span>',
          "https://maps.google.com/?q="+encodeURIComponent(COMPANY.addrEn));
  h += row(ICON.globe, t.web, esc(COMPANY.web.replace(/^https?:\/\//,"")), COMPANY.web);
  h += '</div>';

  h += '<div class="acts">'
     + '<button class="btn solid full" id="btnSave">'+ICON.down+'<span>'+t.save+'</span></button>'
     + '<a class="btn" href="tel:'+intl(p.mobile)+'"><span>'+t.call+'</span></a>'
     + '<a class="btn" href="mailto:'+esc(p.email)+'"><span>'+t.mail+'</span></a>'
     + (opt.noQr ? '' : '<button class="btn full" id="btnQr">'+ICON.qr+'<span>'+t.qr+'</span></button>')
     + '</div>';

  h += '<div class="foot"><div class="co">'+esc(co)+'</div>'
     + '<div class="ad">'+esc(addr)+'</div>'
     + '<a class="wb" href="'+COMPANY.web+'" target="_blank">'+COMPANY.web.replace(/^https?:\/\//,"")+'</a>'
     + '</div>';
  h += '</div>';
  return h;
}
function row(icon, lab, val, href){
  var inner = '<div class="rt"><div class="rlab">'+lab+'</div><div class="rval">'+val+'</div></div>';
  return '<a class="row" href="'+href+'" target="_blank">'+icon+inner+'</a>';
}

/* ---------- QR ---------- */
function qrCanvas(text, size, quiet){
  quiet = (quiet==null) ? 4 : quiet;
  var q = qrcode(0, "M");
  q.addData(text);
  q.make();
  var n = q.getModuleCount();
  var cell = Math.max(1, Math.floor(size / (n + quiet*2)));
  var dim = cell * (n + quiet*2);
  var cv = document.createElement("canvas");
  cv.width = dim; cv.height = dim;
  var g = cv.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0,0,dim,dim);
  g.fillStyle = "#111111";
  for(var r=0;r<n;r++){ for(var c=0;c<n;c++){
    if(q.isDark(r,c)) g.fillRect((c+quiet)*cell, (r+quiet)*cell, cell, cell);
  }}
  return cv;
}
function makeQr(el, text, size){
  el.innerHTML = "";
  try{
    var cv = qrCanvas(text, size);
    cv.style.imageRendering = "pixelated";
    el.appendChild(cv);
  }catch(e){
    el.innerHTML = '<div style="font-size:12px;color:#999;padding:30px">QR을 만들지 못했습니다</div>';
  }
}
function downloadQr(p){
  try{
    var cv = qrCanvas(cardUrl(p.id), 1200);
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "QR_" + (p.nameEn||p.id).replace(/\s+/g,"_") + ".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }catch(e){ alert("QR을 만들지 못했습니다."); }
}

/* ---------- 명함 화면 실행 ---------- */
function viewMode(id){
  var p = findStaff(id);
  var app = document.getElementById("app");
  if(!p){ app.innerHTML='<div class="wrap"><div class="err">'+T[autoLang()].notfound+'</div></div>'; return; }
  var q = new URLSearchParams(location.search);
  var lang = q.get("lang");
  if(p.display==="ko") lang="ko";
  else if(p.display==="en") lang="en";
  else if(lang!=="ko" && lang!=="en") lang = autoLang();
  document.documentElement.lang = lang;
  paint();
  function paint(){
    app.innerHTML = renderCard(p, lang) +
      '<div class="modal" id="qrModal"><div class="mcard">'+
      '<h4>'+T[lang].qrTitle+'</h4><p>'+T[lang].qrSub+'</p>'+
      '<div class="qrbox" id="qrbox"></div>'+
      '<button class="mclose" id="mclose">'+T[lang].close+'</button></div></div>';
    var tg = app.querySelectorAll(".langtoggle button");
    for(var i=0;i<tg.length;i++){ tg[i].onclick = function(){
      lang = this.getAttribute("data-lang"); document.documentElement.lang=lang; paint(); }; }
    document.getElementById("btnSave").onclick = function(){ downloadVcf(p, lang); };
    var bq = document.getElementById("btnQr");
    if(bq) bq.onclick = function(){
      var m=document.getElementById("qrModal"); m.classList.add("on");
      makeQr(document.getElementById("qrbox"), cardUrl(p.id), 424);
    };
    document.getElementById("mclose").onclick=function(){document.getElementById("qrModal").classList.remove("on")};
    document.getElementById("qrModal").onclick=function(e){ if(e.target===this) this.classList.remove("on"); };
  }
}

/* ---------- 관리자 화면 ---------- */
var editing = null, previewLang = "ko";

function adminMode(){
  document.getElementById("app").innerHTML =
   '<div class="adm">'
   + '<h1>PLEATSME 전자명함 관리</h1>'
   + '<p class="desc">직원 정보를 넣으면 명함 주소와 QR 코드가 만들어집니다.<br>작업이 끝나면 <b>맨 아래 [명함 파일 내려받기]</b>를 눌러 받은 파일을 GitHub에 올려 주세요.</p>'
   + '<div class="grid">'
   +   '<div>'
   +     '<div class="panel"><h3>직원 정보</h3><div id="form"></div>'
   +       '<div class="abtns">'
   +         '<button class="abtn solid" id="bSave">저장</button>'
   +         '<button class="abtn" id="bNew">새로 입력</button>'
   +         '<button class="abtn ghost" id="bDel">삭제</button>'
   +       '</div>'
   +       '<div class="urlbox" id="urlbox"></div>'
   +     '</div>'
   +     '<div class="panel" style="margin-top:18px"><h3>등록된 직원</h3><div class="list" id="list"></div>'
   +       '<div class="abtns"><button class="abtn solid" id="bFile">명함 파일 내려받기 (index.html)</button></div>'
   +       '<div class="note"><b>사용 순서</b><br>1. 직원 정보를 넣고 [저장]<br>2. 사람마다 [QR 받기]를 눌러 QR 이미지 저장<br>3. [명함 파일 내려받기]로 index.html을 받아 GitHub에 올리기<br>4. 종이명함 뒷면에 QR을 넣어 인쇄</div>'
   +     '</div>'
   +   '</div>'
   +   '<div><div class="panel"><h3>미리보기</h3>'
   +     '<div style="display:flex;gap:8px;margin-bottom:12px">'
   +       '<button class="abtn" id="pKo" style="flex:1">한국어</button>'
   +       '<button class="abtn" id="pEn" style="flex:1">ENGLISH</button></div>'
   +     '<div class="phone" id="preview"></div></div></div>'
   + '</div></div>';

  document.getElementById("bSave").onclick = saveStaff;
  document.getElementById("bNew").onclick  = function(){ editing=null; drawForm(); };
  document.getElementById("bDel").onclick  = delStaff;
  document.getElementById("bFile").onclick = downloadFile;
  document.getElementById("pKo").onclick = function(){ previewLang="ko"; drawPreview(); };
  document.getElementById("pEn").onclick = function(){ previewLang="en"; drawPreview(); };
  if(!editing && STAFF.length) editing = STAFF[0];
  drawForm(); drawList();
}

function fld(k,lab,val,ph,hint){
  return '<div class="f"><label>'+lab+'</label><input id="f_'+k+'" value="'+esc(val||"")+'" placeholder="'+(ph||"")+'">'
       + (hint?'<div class="hint">'+hint+'</div>':'')+'</div>';
}
function drawForm(){
  var p = editing || {display:"auto"};
  document.getElementById("form").innerHTML =
     fld("id","명함 주소 (영문 소문자)",p.id,"kjh","이 사람 명함의 인터넷 주소가 됩니다. 예: kjh → ?id=kjh")
   + '<div class="f2">'+fld("nameKo","이름 (한글)",p.nameKo,"김지환")+fld("nameEn","이름 (영문)",p.nameEn,"KIM JI HWAN")+'</div>'
   + '<div class="f2">'+fld("deptKo","부서 (한글)",p.deptKo,"영업BU")+fld("deptEn","부서 (영문)",p.deptEn,"Sales BU")+'</div>'
   + '<div class="f2">'+fld("titleKo","직급 (한글)",p.titleKo,"이사")+fld("titleEn","직급 (영문)",p.titleEn,"Director")+'</div>'
   + fld("mobile","휴대전화",p.mobile,"010-0000-0000","영문 명함에서는 자동으로 +82-10-… 으로 바뀝니다")
   + fld("email","이메일",p.email,"name@pleatsme.com")
   + '<div class="f"><label>언어 표기</label><select id="f_display">'
   + '<option value="auto"'+(p.display==="auto"?" selected":"")+'>한글+영문 (전환 버튼 표시 · 추천)</option>'
   + '<option value="ko"'+(p.display==="ko"?" selected":"")+'>한글만</option>'
   + '<option value="en"'+(p.display==="en"?" selected":"")+'>영문만</option>'
   + '</select><div class="hint">추천 설정은 상대방 휴대폰 언어에 맞춰 자동으로 열리고, 버튼으로 바꿀 수 있습니다.</div></div>';
  var ids=["id","nameKo","nameEn","deptKo","deptEn","titleKo","titleEn","mobile","email"];
  ids.forEach(function(k){ document.getElementById("f_"+k).oninput = drawPreview; });
  document.getElementById("f_display").onchange = drawPreview;
  drawPreview();
}
function readForm(){
  function v(k){ var e=document.getElementById("f_"+k); return e?e.value.trim():""; }
  return { id:v("id").toLowerCase().replace(/[^a-z0-9_-]/g,""), nameKo:v("nameKo"), nameEn:v("nameEn"),
    deptKo:v("deptKo"), deptEn:v("deptEn"), titleKo:v("titleKo"), titleEn:v("titleEn"),
    mobile:v("mobile"), email:v("email"), display:document.getElementById("f_display").value };
}
function drawPreview(){
  var p = readForm();
  if(!p.nameKo && !p.nameEn) p.nameKo = "이름을 입력하세요";
  var lang = p.display==="ko"?"ko" : p.display==="en"?"en" : previewLang;
  document.getElementById("preview").innerHTML = renderCard(p, lang, {noQr:true});
  var tg=document.querySelectorAll("#preview .langtoggle button");
  for(var i=0;i<tg.length;i++){ tg[i].onclick=function(){ previewLang=this.getAttribute("data-lang"); drawPreview(); }; }
  var bs=document.querySelector("#preview #btnSave"); if(bs) bs.onclick=function(){ downloadVcf(p, lang); };
  document.getElementById("urlbox").innerHTML = p.id
    ? '이 사람 명함 주소 : <b>'+esc(cardUrl(p.id))+'</b>' : '명함 주소(영문 소문자)를 입력하면 주소가 표시됩니다.';
}
function saveStaff(){
  var p = readForm();
  if(!p.id){ alert("명함 주소(영문 소문자)를 입력해 주세요."); return; }
  if(!p.nameKo && !p.nameEn){ alert("이름을 입력해 주세요."); return; }
  var i = STAFF.findIndex(function(s){ return s.id===p.id; });
  if(i>=0) STAFF[i]=p; else STAFF.push(p);
  editing = p; drawList(); drawPreview();
  alert("저장했습니다.\n\n※ 아직 파일에는 반영되지 않았습니다.\n마지막에 [명함 파일 내려받기]를 꼭 눌러 주세요.");
}
function delStaff(){
  var p=readForm(); if(!p.id) return;
  if(!confirm(p.id+" 님을 목록에서 지울까요?")) return;
  STAFF = STAFF.filter(function(s){ return s.id!==p.id; });
  editing=null; drawForm(); drawList();
}
function drawList(){
  var el=document.getElementById("list");
  if(!STAFF.length){ el.innerHTML='<div style="font-size:12px;color:#aaa;padding:14px 0">등록된 직원이 없습니다.</div>'; return; }
  el.innerHTML = STAFF.map(function(s){
    return '<div class="li"><div class="who"><b>'+esc(s.nameKo||s.nameEn)+'</b>'
      + '<small>'+esc(s.deptKo||"")+' · '+esc(s.titleKo||"")+' · '+esc(s.id)+'</small></div>'
      + '<button class="mini" data-act="edit" data-id="'+esc(s.id)+'">수정</button>'
      + '<button class="mini" data-act="open" data-id="'+esc(s.id)+'">열어보기</button>'
      + '<button class="mini" data-act="qr" data-id="'+esc(s.id)+'">QR 받기</button></div>';
  }).join("");
  var bs=el.querySelectorAll("button");
  for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){
    var id=this.getAttribute("data-id"), act=this.getAttribute("data-act"), p=findStaff(id);
    if(act==="edit"){ editing=p; drawForm(); }
    if(act==="open"){ window.open(cardUrl(id),"_blank"); }
    if(act==="qr"){ downloadQr(p); }
  }; }
}
function staffCode(){
  var body = STAFF.map(function(s){
    return '  {\n'
      +'    id: '+JSON.stringify(s.id)+',\n'
      +'    nameKo: '+JSON.stringify(s.nameKo||"")+',  nameEn: '+JSON.stringify(s.nameEn||"")+',\n'
      +'    deptKo: '+JSON.stringify(s.deptKo||"")+',  deptEn: '+JSON.stringify(s.deptEn||"")+',\n'
      +'    titleKo: '+JSON.stringify(s.titleKo||"")+', titleEn: '+JSON.stringify(s.titleEn||"")+',\n'
      +'    mobile: '+JSON.stringify(s.mobile||"")+',\n'
      +'    email:  '+JSON.stringify(s.email||"")+',\n'
      +'    display: '+JSON.stringify(s.display||"auto")+'\n'
      +'  }';
  }).join(",\n");
  return "/* ===== 직원 데이터 시작 ===== */\nvar STAFF = [\n"+body+"\n];\n/* ===== 직원 데이터 끝 ===== */";
}
function downloadFile(){
  fetch(location.pathname, {cache:"no-store"}).then(function(r){ return r.text(); }).then(function(src){
    var s = src.indexOf("/* ===== 직원 데이터 시작 ===== */");
    var e = src.indexOf("/* ===== 직원 데이터 끝 ===== */");
    if(s<0 || e<0) throw new Error("marker");
    e += "/* ===== 직원 데이터 끝 ===== */".length;
    var out = src.slice(0,s) + staffCode() + src.slice(e);
    var blob = new Blob([out],{type:"text/html;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="index.html"; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  }).catch(function(){
    prompt("아래 내용을 복사해 index.html 파일의 같은 자리에 붙여 넣어 주세요.", staffCode());
  });
}

/* ---------- 시작 ---------- */
(function(){
  var id = new URLSearchParams(location.search).get("id");
  if(id) viewMode(id); else adminMode();
})();
</script>
